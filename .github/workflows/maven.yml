
name: MuleSoft CI/CD

on:
  push:
    branches: [ "Sandbox", "Design" ]

  pull_request:
    branches: [ "Sandbox", "Design" ]

jobs:
  buildAndDeploy:

    runs-on: ubuntu-latest

    environment: ${{ github.event.pull_request.base.ref || github.ref_name }}

    steps:

    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Validate Environment Variable
      run: |
        if [ -z "${{ vars.MULE_ENV }}" ]; then
          echo "--- MULE ENV VARIABLE IS NOT SET ---"
          exit 1
        fi

        echo "--- Deploying to ${{ vars.MULE_ENV }} environment. ---"

    - name: Build application
      run: |
        mvn clean package \
          --file pom.xml \
          --settings settings.xml

    - name: Publish to Anypoint Exchange
      if: github.event_name == 'push' && github.ref_name == 'Sandbox'
      run: |
        mvn deploy \
          -DskipMuleDeploy \
          -Dclient_id="${{ vars.MULE_CLIENT_ID }}" \
          -Dclient_secret="${{ secrets.MULE_CLIENT_SECRET }}" \
          --file pom.xml \
          --settings settings.xml

    - name: Deploy to CloudHub
      if: github.event_name == 'push'
      run: |
        mvn deploy \
          -DmuleDeploy \
          -Dmule.env="${{ vars.MULE_ENV }}" \
          -Dclient_id="${{ vars.MULE_CLIENT_ID }}" \
          -Dclient_secret="${{ secrets.MULE_CLIENT_SECRET }}" \
          -Dmule.instance="${{ vars.MULE_INSTANCE }}" \
          --file pom.xml \
          --settings settings.xml

    - name: Deployment Summary
      if: success()
      run: |
        echo "--- Deployment successful to ${{ vars.MULE_ENV }} environment ---"

    # Optional: Upload dependency graph to GitHub
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

